set -g set-clipboard on
set-option -g default-shell /bin/zsh

unbind C-b
set-option -g prefix C-f
bind C-f send-prefix

# vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-f copy-mode

# move windows
bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# split with h, v
bind v split-window -h -c "#{pane_current_path}"
bind f split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key -r -T prefix       C-k            resize-pane -U 5
bind-key -r -T prefix       C-j            resize-pane -D 5
bind-key -r -T prefix       C-h            resize-pane -L 5
bind-key -r -T prefix       C-l            resize-pane -R 5

# color stuff (?)
# set -g default-terminal "$TERM"
# set -ag terminal-overrides ",$TERM:Tc"
set -sg escape-time 100

# keep plugins outside the symlinked dotfiles checkout
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'xamut/tmux-weather'
# set -g @plugin 'ofirgall/tmux-window-name'
# set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
# Use v to trigger selection
bind-key -T copy-mode-vi v send-keys -X begin-selection
# Use y to yank current selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

set -g mouse on

set -g escape-time 10
set -g set-clipboard on
set -g allow-passthrough on

# disable "release mouse drag to copy and exit copy-mode", ref: https://github.com/tmux/tmux/issues/140
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# since MouseDragEnd1Pane neither exit copy-mode nor clear selection now,
# let single click do selection clearing for us.
bind-key -T copy-mode-vi MouseDown1Pane select-pane\; send-keys -X clear-selection

# Detect vim/nvim/fzf/opencode from tmux's foreground-process metadata. Using
# a format keeps high-frequency mouse events inside tmux instead of spawning a
# `ps | grep` subprocess for every trackpad tick.
is_vim="#{m/r:^(g?(view|l?n?vim?x?)(diff)?|fzf|opencode)$,#{pane_current_command}}"

# Pass all mouse events to vim when detected
bind -n MouseDown1Pane   if-shell -F "$is_vim" "send-keys -M" "select-pane -t = ; send-keys -M"
bind -n MouseDown2Pane   if-shell -F "$is_vim" "send-keys -M" "select-pane -t = ; send-keys -M"
bind -n MouseDown3Pane   if-shell -F "$is_vim" "send-keys -M" "select-pane -t = ; send-keys -M"
bind -n MouseUp1Pane     if-shell -F "$is_vim" "send-keys -M" ""
bind -n MouseDrag1Pane   if-shell -F "$is_vim" "send-keys -M" "if -Ft= '#{mouse_any_flag}' 'copy-mode -M' ''"
bind -n MouseDrag2Pane   if-shell -F "$is_vim" "send-keys -M" ""
bind -n MouseDrag3Pane   if-shell -F "$is_vim" "send-keys -M" ""
bind -n WheelUpPane      if-shell -F "$is_vim" "send-keys -M" "select-pane -t = ; copy-mode -e ; send-keys -M"
bind -n WheelDownPane    if-shell -F "$is_vim" "send-keys -M" "select-pane -t = ; send-keys -M"
bind -n C-WheelUpPane    if-shell -F "$is_vim" "send-keys -M" ""
bind -n C-WheelDownPane  if-shell -F "$is_vim" "send-keys -M" ""

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm-kitty:RGB"
set-option -sa terminal-overrides ",xterm-256color:RGB"

set -g @catppuccin_window_left_separator "  "
set -g @catppuccin_window_right_separator "  "

set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_status_background "none"
set-option -g @catppuccin_window_status_style "basic"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_current_text "#W"

run '~/.tmux/catppuccin/tmux/catppuccin.tmux'

set -g status-left ""
set -g status-right '#{E:@catppuccin_status_session}'
set -agF status-right '#{E:@catppuccin_status_battery}'
set -agF status-right '#{E:@catppuccin_status_weather}'
# set-option -g default-command "i > /dev/null 2>&1; reattach-to-user-namespace -l bash"

set-option -g update-environment "PATH"

run '~/.tmux/plugins/tpm/tpm'
