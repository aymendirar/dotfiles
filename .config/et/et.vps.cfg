; et.vps.cfg : Eternal Terminal server config for a public VPS
;
; Owned by this repo and copied to /etc/et.cfg by vps-install.sh, which is where
; the packaged systemd unit reads it from. Copied rather than symlinked because
; the unit runs etserver as root and /etc should not depend on a file under a
; user's home.
;
; This differs from .config/et/et.cfg (the devbox config) in one important way:
; bind_ip. On a Coder devbox the server binds loopback because Coder tunnels
; into the workspace and nothing reaches it directly. A VPS is dialled straight
; from the internet, so loopback there would make it unreachable.
;
; Binding all interfaces means the port is exposed. ET still requires a full ssh
; handshake before it will hand over a terminal, so this is an ssh-authenticated
; service rather than an open shell, but it is worth keeping behind a firewall
; that only admits the addresses you actually connect from.

[Networking]
port = 2022
bind_ip = 0.0.0.0

[Debug]
verbose = 0
silent = 0
logsize = 20971520
telemetry = false
logdirectory = /var/log
