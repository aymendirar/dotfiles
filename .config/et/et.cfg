; et.cfg : Eternal Terminal server config
;
; Owned by this repo and symlinked to ~/.config/et/et.cfg. The et:start mise
; task passes it to etserver with --cfgfile, so the server never depends on a
; hand-edited /etc/et.cfg that no machine agrees on.
;
; The server binds loopback only. Both ways in reach it from inside the
; workspace: Coder Connect publishes the port at the workspace's .coder
; hostname, and `coder port-forward` lands on 127.0.0.1 too. Verified with
; `nc -vz <host>.coder 2022` against this bind_ip. Loopback is therefore all
; that is ever needed, and it keeps the terminal port off the workspace network.

[Networking]
port = 2022
bind_ip = 127.0.0.1

[Debug]
verbose = 0
silent = 0
logsize = 20971520
telemetry = false
; /tmp rather than a path under $HOME: this file is shared across machines and
; must not hard-code a home directory. The task wrapper's own stdout goes to
; ~/.local/state/et instead.
logdirectory = /tmp
